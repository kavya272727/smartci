
name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - run: pip install -r requirements.txt

      - name: Select tests
        id: sel
        run: echo "tests=$(python scripts/select_tests.py)" >> $GITHUB_OUTPUT

      - name: Run tests
        run: |
          set -o pipefail
          pytest ${{ steps.sel.outputs.tests }} 2>&1 | tee build.log
