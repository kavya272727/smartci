name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - run: pip install -r requirements.txt

      - name: Select tests
        id: sel
        run: echo "tests=$(python scripts/select_tests.py)" >> $GITHUB_OUTPUT

      - name: Predict build failure risk
        run: python scripts/predict_failure.py | tee -a $GITHUB_STEP_SUMMARY

      - name: Demonstrate high-risk prediction
        run: python scripts/predict_failure.py --changed-files 10 --lines-changed 1200 --test-files-changed 4 --previous-failures 3 | tee -a $GITHUB_STEP_SUMMARY

      - name: Run tests
        run: |
          set -o pipefail
          pytest ${{ steps.sel.outputs.tests }} 2>&1 | tee build.log

      - name: Explain failure
        if: failure()
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/summarize_log.py build.log >> $GITHUB_STEP_SUMMARY
